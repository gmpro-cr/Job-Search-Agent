name: Backfill Embeddings

# One-time / on-demand: embed every job_listings row whose embedding is NULL,
# using all-MiniLM-L6-v2. Idempotent — safe to re-run; only touches rows still
# missing a vector. Manual trigger only.
on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-scraper.txt

      - name: Backfill embeddings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          python -m scripts.backfill_embeddings
