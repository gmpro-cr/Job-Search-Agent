name: Daily Job Scrape

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST
    - cron: '30 13 * * *'  # 7:00 PM IST
  workflow_dispatch:

# Never run two scrapes at once (a manual dispatch overlapping a schedule, or a
# delayed schedule) — concurrent runs race the same Neon DB and can double-send.
# Queue a new run rather than killing one mid-write.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Public repo -> free minutes. 150 (not 90) so the run finishes its later
    # phases (per-routine emails + dedup marking) instead of being cancelled
    # mid-pipeline, which left dedup markers unwritten and caused repeat emails.
    timeout-minutes: 150

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Pin Chrome so Selenium scraping is deterministic (don't rely on whatever
      # the runner image happens to ship).
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Cache embedding model
        # all-MiniLM-L6-v2 (~80MB). sentence-transformers may cache under either
        # path depending on version, so cache both.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/sentence_transformers
          key: hf-all-MiniLM-L6-v2-v1
          restore-keys: |
            hf-all-MiniLM-L6-v2

      - name: Install dependencies
        # Slim Vercel deps + scraper-only extras (selenium, sentence-transformers, etc).
        run: |
          pip install -r requirements.txt
          pip install -r requirements-scraper.txt

      - name: Run scraper
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          # Neon Postgres — database.py auto-routes to psycopg when set.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          # Vercel Blob — digest_generator + prd_generator push artefacts here
          # so the Vercel-hosted web UI can read them.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scrape_and_push.py

      - name: Notify owner by email on failure
        if: ${{ failure() || cancelled() }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
