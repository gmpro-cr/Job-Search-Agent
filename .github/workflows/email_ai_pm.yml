name: Email AI PM Jobs

# Manual / on-demand only. The automatic daily send now happens inside the main
# scrape cron (scrape_and_push.py, Phase 7f) for users who enabled the AI PM jobs
# routine on the digests page. Use this for a one-off / test send.
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Recipient email'
        required: false
        default: 'mahalegauravk@gmail.com'

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install slim deps
        run: pip install -r requirements.txt
      - name: Send AI PM digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AI_PM_RECIPIENT: ${{ github.event.inputs.recipient }}
        run: python -m scripts.email_ai_pm
